name: test
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # Only the Python suites run here. The Lua suites under reaper/test/ need a
    # running REAPER instance and are run locally via tools/run_tests.py.
    - name: Run unit tests
      run: python -m unittest discover -s tests -t . -v
